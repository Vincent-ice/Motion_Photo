name: Apply image feature patch

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/apply-image-features.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply PNG and image-aspect changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch target: {label}')
              return text.replace(old, new, 1)

          activity_path = Path('app/src/main/java/com/example/motionphotomaker/AlignedEditorActivity.kt')
          s = activity_path.read_text()

          s = must_replace(s,
              '    private val aspectButtons = mutableListOf<Pair<Button, Float?>>()\n',
              '''    private enum class AspectMode { VIDEO, IMAGE, FIXED }\n\n    private var aspectMode = AspectMode.VIDEO\n    private var videoAspectButton: Button? = null\n    private var imageAspectButton: Button? = null\n    private val aspectButtons = mutableListOf<Pair<Button, Float?>>()\n''',
              'aspect mode fields')

          s = s.replace('coverName.text = displayName(uri) ?: "已选择 JPEG 封面"',
                        'coverName.text = displayName(uri) ?: "已选择 JPEG / PNG 封面"')
          s = s.replace('secondaryButton("选择 JPEG 封面")', 'secondaryButton("选择 JPEG / PNG 封面")')
          s = s.replace('statusText = label("选择视频和 JPEG 封面后生成。预览与导出现在使用同一组裁剪参数。", 13f)',
                        'statusText = label("选择视频和 JPEG / PNG 封面后生成。可用“图片”比例让最终视频跟随封面原比例。", 13f)')
          s = s.replace('statusText.text = "封面预览解码失败，请换一张 JPEG。"',
                        'statusText.text = "封面预览解码失败，请换一张 JPEG 或 PNG。"')

          old_ratio = '''        listOf(\n            "原始" to null,\n            "1:1" to 1f,\n            "4:3" to (4f / 3f),\n            "3:4" to (3f / 4f),\n            "16:9" to (16f / 9f),\n            "9:16" to (9f / 16f),\n        ).forEach { (title, ratio) ->\n            val button = chipButton(title)\n            button.setOnClickListener {\n                targetAspect = ratio ?: if (sourceHeight > 0) {\n                    sourceWidth.toFloat() / sourceHeight.toFloat()\n                } else {\n                    9f / 16f\n                }\n                resetVideoTransform()\n                resetCoverTransform()\n                coverCropView.targetAspect = targetAspect\n                updateAspectButtons(button)\n                updateViewportSizes()\n            }\n            aspectButtons += button to ratio\n            ratioRow.addView(\n                button,\n                LinearLayout.LayoutParams(\n                    ViewGroup.LayoutParams.WRAP_CONTENT,\n                    dp(42),\n                ).apply { marginEnd = dp(8) },\n            )\n        }\n'''
          new_ratio = '''        listOf(\n            "原始" to null,\n            "1:1" to 1f,\n            "4:3" to (4f / 3f),\n            "3:4" to (3f / 4f),\n            "16:9" to (16f / 9f),\n            "9:16" to (9f / 16f),\n        ).forEach { (title, ratio) ->\n            val button = chipButton(title)\n            if (title == "原始") videoAspectButton = button\n            button.setOnClickListener {\n                aspectMode = if (ratio == null) AspectMode.VIDEO else AspectMode.FIXED\n                targetAspect = ratio ?: if (sourceHeight > 0) {\n                    sourceWidth.toFloat() / sourceHeight.toFloat()\n                } else {\n                    9f / 16f\n                }\n                resetVideoTransform()\n                resetCoverTransform()\n                coverCropView.targetAspect = targetAspect\n                updateAspectButtons(button)\n                updateViewportSizes()\n            }\n            aspectButtons += button to ratio\n            ratioRow.addView(\n                button,\n                LinearLayout.LayoutParams(\n                    ViewGroup.LayoutParams.WRAP_CONTENT,\n                    dp(42),\n                ).apply { marginEnd = dp(8) },\n            )\n        }\n\n        val imageButton = chipButton("图片")\n        imageAspectButton = imageButton\n        imageButton.setOnClickListener {\n            val bitmap = coverBitmap\n            if (bitmap == null || bitmap.height <= 0) {\n                statusText.text = "请先选择 JPEG 或 PNG 封面，再使用“图片”比例。"\n                return@setOnClickListener\n            }\n            aspectMode = AspectMode.IMAGE\n            targetAspect = bitmap.width.toFloat() / bitmap.height.toFloat()\n            resetVideoTransform()\n            resetCoverTransform()\n            coverCropView.targetAspect = targetAspect\n            updateAspectButtons(imageButton)\n            updateViewportSizes()\n            statusText.text =\n                "已使用图片原比例 ${bitmap.width}:${bitmap.height}（${"%.4f".format(targetAspect)}）。"\n        }\n        aspectButtons += imageButton to null\n        ratioRow.addView(\n            imageButton,\n            LinearLayout.LayoutParams(\n                ViewGroup.LayoutParams.WRAP_CONTENT,\n                dp(42),\n            ).apply { marginEnd = dp(8) },\n        )\n'''
          s = must_replace(s, old_ratio, new_ratio, 'ratio controls')

          old_video_aspect = '''            targetAspect = if (sourceHeight > 0) {\n                sourceWidth.toFloat() / sourceHeight.toFloat()\n            } else {\n                9f / 16f\n            }\n'''
          new_video_aspect = '''            if (aspectMode == AspectMode.VIDEO) {\n                targetAspect = if (sourceHeight > 0) {\n                    sourceWidth.toFloat() / sourceHeight.toFloat()\n                } else {\n                    9f / 16f\n                }\n            }\n'''
          s = must_replace(s, old_video_aspect, new_video_aspect, 'video aspect load')

          s = must_replace(s,
              '            updateAspectButtons(aspectButtons.first().first)\n            updateViewportSizes()\n',
              '''            when (aspectMode) {\n                AspectMode.VIDEO -> videoAspectButton?.let(::updateAspectButtons)\n                AspectMode.IMAGE -> imageAspectButton?.let(::updateAspectButtons)\n                AspectMode.FIXED -> Unit\n            }\n            updateViewportSizes()\n''',
              'video selected ratio state')

          old_cover_loaded = '''                coverBitmap = bmp\n                coverCropView.setBitmap(bmp)\n                coverCropView.targetAspect = targetAspect\n                resetCoverTransform()\n                updateViewportSizes()\n'''
          new_cover_loaded = '''                coverBitmap = bmp\n                coverCropView.setBitmap(bmp)\n                if (aspectMode == AspectMode.IMAGE && bmp.height > 0) {\n                    targetAspect = bmp.width.toFloat() / bmp.height.toFloat()\n                    resetVideoTransform()\n                    imageAspectButton?.let(::updateAspectButtons)\n                }\n                coverCropView.targetAspect = targetAspect\n                resetCoverTransform()\n                updateViewportSizes()\n'''
          s = must_replace(s, old_cover_loaded, new_cover_loaded, 'cover image aspect refresh')

          s = s.replace('        updateAspectButtons(aspectButtons.last().first)\n',
                        '        updateAspectButtons(videoAspectButton ?: aspectButtons.first().first)\n')
          activity_path.write_text(s)

          generator_path = Path('app/src/main/java/com/example/motionphotomaker/MotionPhotoGenerator.kt')
          s = generator_path.read_text()
          s = must_replace(s,
              '''        require(coverMime == null || coverMime.equals("image/jpeg", ignoreCase = true)) {\n            "当前版本只支持 JPEG 封面；当前类型：$coverMime"\n        }\n''',
              '''        require(\n            coverMime == null ||\n                coverMime.equals("image/jpeg", ignoreCase = true) ||\n                coverMime.equals("image/png", ignoreCase = true)\n        ) {\n            "当前版本只支持 JPEG / PNG 封面；当前类型：$coverMime"\n        }\n''',
              'cover MIME validation')
          s = must_replace(s,
              '''            val jpegOriginal = resolver.openInputStream(coverUri)?.use { it.readBytes() }\n                ?: error("无法读取所选封面。")\n            val croppedCover = VideoCompat.cropCover(jpegOriginal, coverParams)\n''',
              '''            val coverOriginal = resolver.openInputStream(coverUri)?.use { it.readBytes() }\n                ?: error("无法读取所选封面。")\n            val croppedCover = VideoCompat.cropCover(coverOriginal, coverMime, coverParams)\n''',
              'generic cover bytes')
          generator_path.write_text(s)

          compat_path = Path('app/src/main/java/com/example/motionphotomaker/VideoCompat.kt')
          s = compat_path.read_text()
          s = s.replace('import android.graphics.BitmapFactory\n',
                        'import android.graphics.BitmapFactory\nimport android.graphics.Canvas\nimport android.graphics.Color\n')

          pattern = re.compile(r'''    fun cropCover\(\n        jpeg: ByteArray,\n        params: CoverEditParams,\n    \): ByteArray \{.*?\n    private fun verifyDecodableFrame''', re.S)
          replacement = '''    fun cropCover(\n        image: ByteArray,\n        mimeType: String?,\n        params: CoverEditParams,\n    ): ByteArray {\n        require(params.targetAspect > 0f)\n        val oriented = decodeOrientedImage(image, mimeType)\n\n        val crop = CropMath.computePixels(\n            sourceWidth = oriented.width,\n            sourceHeight = oriented.height,\n            targetAspect = params.targetAspect,\n            zoom = params.zoom,\n            panX = params.panX,\n            panY = params.panY,\n        )\n\n        var cropH = crop.height.roundToInt().coerceIn(1, oriented.height)\n        var cropW = (cropH * params.targetAspect).roundToInt().coerceAtLeast(1)\n        if (cropW > oriented.width) {\n            cropW = crop.width.roundToInt().coerceIn(1, oriented.width)\n            cropH = (cropW / params.targetAspect).roundToInt().coerceIn(1, oriented.height)\n        }\n\n        val centerX = (crop.left + crop.right) / 2f\n        val centerY = (crop.top + crop.bottom) / 2f\n        val cropX = (centerX - cropW / 2f)\n            .roundToInt()\n            .coerceIn(0, oriented.width - cropW)\n        val cropY = (centerY - cropH / 2f)\n            .roundToInt()\n            .coerceIn(0, oriented.height - cropH)\n\n        val cropped = Bitmap.createBitmap(oriented, cropX, cropY, cropW, cropH)\n        val jpegBitmap = if (cropped.hasAlpha()) {\n            Bitmap.createBitmap(cropped.width, cropped.height, Bitmap.Config.ARGB_8888).also { matte ->\n                Canvas(matte).apply {\n                    drawColor(Color.WHITE)\n                    drawBitmap(cropped, 0f, 0f, null)\n                }\n            }\n        } else {\n            cropped\n        }\n\n        val out = ByteArrayOutputStream()\n        require(jpegBitmap.compress(Bitmap.CompressFormat.JPEG, 95, out)) {\n            "JPEG 封面重新编码失败。"\n        }\n\n        if (jpegBitmap !== cropped) jpegBitmap.recycle()\n        if (cropped !== oriented) cropped.recycle()\n        oriented.recycle()\n        return out.toByteArray()\n    }\n\n    private fun decodeOrientedImage(image: ByteArray, mimeType: String?): Bitmap {\n        val isJpeg = mimeType.equals("image/jpeg", ignoreCase = true) ||\n            (image.size >= 2 && (image[0].toInt() and 0xFF) == 0xFF &&\n                (image[1].toInt() and 0xFF) == 0xD8)\n        val isPng = mimeType.equals("image/png", ignoreCase = true) ||\n            (image.size >= 8 &&\n                (image[0].toInt() and 0xFF) == 0x89 && image[1].toInt() == 0x50 &&\n                image[2].toInt() == 0x4E && image[3].toInt() == 0x47 &&\n                image[4].toInt() == 0x0D && image[5].toInt() == 0x0A &&\n                image[6].toInt() == 0x1A && image[7].toInt() == 0x0A)\n        require(isJpeg || isPng) { "封面不是有效的 JPEG 或 PNG。" }\n\n        val orientation = if (isJpeg) {\n            runCatching {\n                ExifInterface(ByteArrayInputStream(image)).getAttributeInt(\n                    ExifInterface.TAG_ORIENTATION,\n                    ExifInterface.ORIENTATION_NORMAL,\n                )\n            }.getOrDefault(ExifInterface.ORIENTATION_NORMAL)\n        } else {\n            ExifInterface.ORIENTATION_NORMAL\n        }\n\n        val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }\n        BitmapFactory.decodeByteArray(image, 0, image.size, bounds)\n        require(bounds.outWidth > 0 && bounds.outHeight > 0) { "无法解码 JPEG / PNG 封面。" }\n\n        var sample = 1\n        while (bounds.outWidth / sample > 4096 || bounds.outHeight / sample > 4096) {\n            sample *= 2\n        }\n\n        val decoded = BitmapFactory.decodeByteArray(\n            image,\n            0,\n            image.size,\n            BitmapFactory.Options().apply { inSampleSize = sample },\n        ) ?: error("无法解码 JPEG / PNG 封面。")\n\n        val matrix = Matrix()\n        when (orientation) {\n            ExifInterface.ORIENTATION_ROTATE_90 -> matrix.postRotate(90f)\n            ExifInterface.ORIENTATION_ROTATE_180 -> matrix.postRotate(180f)\n            ExifInterface.ORIENTATION_ROTATE_270 -> matrix.postRotate(270f)\n            ExifInterface.ORIENTATION_FLIP_HORIZONTAL -> matrix.postScale(-1f, 1f)\n            ExifInterface.ORIENTATION_FLIP_VERTICAL -> matrix.postScale(1f, -1f)\n            ExifInterface.ORIENTATION_TRANSPOSE -> {\n                matrix.postScale(-1f, 1f)\n                matrix.postRotate(270f)\n            }\n            ExifInterface.ORIENTATION_TRANSVERSE -> {\n                matrix.postScale(-1f, 1f)\n                matrix.postRotate(90f)\n            }\n        }\n\n        return if (!matrix.isIdentity) {\n            Bitmap.createBitmap(\n                decoded,\n                0,\n                0,\n                decoded.width,\n                decoded.height,\n                matrix,\n                true,\n            ).also {\n                if (it !== decoded) decoded.recycle()\n            }\n        } else {\n            decoded\n        }\n    }\n\n    private fun verifyDecodableFrame'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('missing patch target: cropCover/decode image block')
          compat_path.write_text(s2)

          readme_path = Path('README.md')
          s = readme_path.read_text()
          s = s.replace('把任意 JPEG 封面与 MP4 视频制作成 Motion Photo。',
                        '把 JPEG / PNG 封面与 MP4 视频制作成 Motion Photo。')
          s = s.replace('- 从任意 **JPEG + MP4** 生成单文件 Android / Google Motion Photo。',
                        '- 从 **JPEG / PNG + MP4** 生成单文件 Android / Google Motion Photo；PNG 会转换为 JPEG 主图，透明区域使用白色背景。')
          s = s.replace('- 支持原始、1:1、4:3、3:4、16:9、9:16 等输出比例。',
                        '- 支持原始、图片原比例、1:1、4:3、3:4、16:9、9:16 等输出比例。')
          s = s.replace('4. 选择 JPEG 封面，在封面预览中调整裁剪位置和缩放。',
                        '4. 选择 JPEG 或 PNG 封面，可选择“图片”比例让最终输出跟随封面原比例，并调整封面裁剪位置和缩放。')
          readme_path.write_text(s)

          changelog_path = Path('CHANGELOG.md')
          s = changelog_path.read_text()
          marker = '## [Unreleased]\n'
          addition = '''## [Unreleased]\n\n### Added\n- Support PNG cover images; PNG covers are converted to the final JPEG primary image with transparent pixels composited on white.\n- Add an “图片” output-aspect option that uses the selected cover image’s original aspect ratio for both video export and the final Motion Photo.\n'''
          if marker not in s:
              raise SystemExit('missing CHANGELOG Unreleased marker')
          s = s.replace(marker, addition, 1)
          changelog_path.write_text(s)
          PY

      - name: Build patched development APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Commit tested feature changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-image-features.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/motionphotomaker/AlignedEditorActivity.kt \
                  app/src/main/java/com/example/motionphotomaker/MotionPhotoGenerator.kt \
                  app/src/main/java/com/example/motionphotomaker/VideoCompat.kt \
                  README.md CHANGELOG.md .github/workflows/apply-image-features.yml
          git commit -m 'feat: support PNG covers and image aspect ratio [skip ci]'
          git push origin HEAD:develop
