name: Finalize v0.1.0 metadata

on:
  push:
    branches: [ develop ]

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Install canonical license texts
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://www.gnu.org/licenses/gpl-3.0.txt -o LICENSE
          mkdir -p THIRD_PARTY_LICENSES
          curl -fsSL https://www.apache.org/licenses/LICENSE-2.0.txt -o THIRD_PARTY_LICENSES/Apache-2.0.txt
          sed -i 's/预览 \/ 导出同坐标系 · develop/v0.1.0 · 预览 \/ 导出同坐标系/' app/src/main/java/com/example/motionphotomaker/AlignedEditorActivity.kt
          rm -f .github/workflows/finalize-v0.1.0.yml
      - name: Commit finalized release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE THIRD_PARTY_LICENSES/Apache-2.0.txt app/src/main/java/com/example/motionphotomaker/AlignedEditorActivity.kt .github/workflows/finalize-v0.1.0.yml
          git commit -m "Finalize v0.1.0 licensing and UI [skip ci]"
          git push origin HEAD:develop
