name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Read version name
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "MotionPhotoMaker-${{ steps.version.outputs.version_name }}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionPhotoMaker-${{ steps.version.outputs.version_name }}-APK
          path: MotionPhotoMaker-${{ steps.version.outputs.version_name }}.apk
          if-no-files-found: error
